[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dst-engine"
version = "0.1.0"
description = "SAMPT/SAVI structures asset valuation and planning engine (proof of concept)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "pandera>=0.20", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
dst-engine = "dst_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "regression: compares engine output with SAVI v1.10's calculated sample run",
  "slow: reads the original SAVI workbook",
  "ui: Playwright flow tests against web/dist/preview.html (build the page first)",
]
filterwarnings = ["ignore::UserWarning:openpyxl"]
